name: Android Build

# ビルドを走らせるタイミング
on:
  push:
    branches: [ "main" ]        # main に push したら自動ビルド
    tags: [ "v*" ]              # タグを push したらビルドして GitHub Release に APK を添付
  workflow_dispatch:            # Actionsタブから手動実行も可能にする

# Release の作成と APK の添付には書き込み権限が必要
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Stable signing key (GitHub repository secrets). Without them the build falls back to the
    # throwaway debug key of the runner - fine for testing, but such an APK cannot be installed
    # over a previous release. See README "Release signing".
    env:
      IMMICHFRAME_KEYSTORE_BASE64: ${{ secrets.IMMICHFRAME_KEYSTORE_BASE64 }}
      IMMICHFRAME_KEYSTORE_PASSWORD: ${{ secrets.IMMICHFRAME_KEYSTORE_PASSWORD }}
      IMMICHFRAME_KEY_ALIAS: ${{ secrets.IMMICHFRAME_KEY_ALIAS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # リリースノート生成にタグ履歴が必要

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare the signing keystore
        if: env.IMMICHFRAME_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$IMMICHFRAME_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/immichframe.keystore"
          echo "IMMICHFRAME_KEYSTORE_FILE=$RUNNER_TEMP/signing/immichframe.keystore" >> "$GITHUB_ENV"
          echo "Keystore ready."

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Show the signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BUILD_TOOLS" ]; then
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          else
            echo "apksigner not found, skipping the certificate check"
          fi

      # signing.properties が無い状態だと release ビルドは署名で失敗するため
      # まずは署名不要な debug APK をビルド・配布する構成にしています。

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmichFrame-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # タグ (v*) の push 時のみ: GitHub Release を作成して debug APK を添付する。
      # ノートは前回のタグからのコミット履歴から生成する。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            echo "## ImmichFrame Android $GITHUB_REF_NAME"
            echo
            echo "端末用 APK は下の Assets からダウンロードしてください（debug ビルド / debug キーで署名）。"
            echo "Download the APK from the Assets section below (debug build, debug key)."
            echo
            if [ -n "$previous_tag" ]; then
              echo "### このリリースの変更 / Changes since $previous_tag"
              echo
              git log --no-merges --pretty=format:'- %s (`%h`)' "$previous_tag..$GITHUB_REF_NAME"
              echo
              echo
            fi
            echo "### インストール / Install"
            echo "1. \`app-debug.apk\` をダウンロード"
            echo "2. 端末で「提供元不明のアプリ」からのインストールを許可してインストール"
            echo
            echo "使い方は README を参照してください。"
          } > "$RUNNER_TEMP/release-notes.md"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/debug/*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "ImmichFrame Android $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              app/build/outputs/apk/debug/*.apk
          fi
